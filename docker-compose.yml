services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-taskflow}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-taskflow}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-taskflow}
    # Use 27018 on the host so an existing local MongoDB service is untouched.
    ports: ["${MONGO_PORT:-27018}:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-taskflow}
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-taskflow}:${MONGO_INITDB_ROOT_PASSWORD:-taskflow}@mongodb:27017/taskflow?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-taskflow}@redis:6379
      CLIENT_ORIGIN: http://localhost:3000
    ports: ["4000:4000"]
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:4000}
    environment:
      NODE_ENV: production
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  mongo-data:
  redis-data:
